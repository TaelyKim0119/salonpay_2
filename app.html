<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>살롱페이 v2.0</title>

    <!-- Pretendard 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

    <!-- 스타일시트 -->
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="app-container">

        <!-- ===== 메인 화면 - iOS Style with Characters ===== -->
        <div id="main" class="screen main-screen active">
            <div class="main-logo">
                <img src="이미지/logo.png" alt="살롱페이" class="logo-image">
                <h1>살롱페이</h1>
                <p>스마트한 미용실 적립금 관리</p>
            </div>

            <div class="main-buttons">
                <button id="btn-customer" class="main-btn main-btn-customer">
                    <div class="btn-icon">
                        <img src="이미지/customers.png" alt="고객">
                    </div>
                    <div class="main-btn-text">
                        <div class="btn-title">고객</div>
                        <div class="btn-subtitle">적립금 조회 및 사용</div>
                    </div>
                    <span class="btn-arrow">›</span>
                </button>

                <button id="btn-admin" class="main-btn main-btn-admin">
                    <div class="btn-icon">
                        <img src="이미지/관리자2.png" alt="관리자">
                    </div>
                    <div class="main-btn-text">
                        <div class="btn-title">관리자</div>
                        <div class="btn-subtitle">고객 관리 및 통계</div>
                    </div>
                    <span class="btn-arrow">›</span>
                </button>
            </div>
        </div>

        <!-- ===== 고객 로그인 화면 ===== -->
        <div id="customer-login" class="screen login-screen">
            <div class="login-header">
                <h2>안녕하세요!</h2>
                <p>전화번호로 간편하게 조회하세요</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="input-group">
                    <label for="phone-input">전화번호</label>
                    <input
                        type="tel"
                        id="phone-input"
                        placeholder="010-0000-0000"
                        maxlength="13"
                        autocomplete="tel"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary">조회하기</button>
                <button type="button" class="btn-secondary" onclick="showScreen('main')">돌아가기</button>
            </form>
        </div>

        <!-- ===== 고객 대시보드 ===== -->
        <div id="customer-dashboard" class="screen customer-dashboard">
            <header class="app-header">
                <button class="header-back">←</button>
                <h1 class="header-title">내 적립금</h1>
                <div class="header-action"></div>
            </header>

            <!-- 환영 이미지 -->
            <div class="welcome-character">
                <img src="이미지/magazine.png" alt="환영 캐릭터">
            </div>

            <!-- 잔고 카드 -->
            <div class="balance-card">
                <div class="customer-name" id="customer-name-display">김민지 님</div>
                <div class="customer-phone" id="customer-phone-display">010-1234-5678</div>
                <div class="balance-label">사용 가능한 적립금</div>
                <div class="balance-amount"><span id="customer-balance">0</span> <span>P</span></div>
            </div>

            <!-- 정보 카드 -->
            <div class="info-cards">
                <div class="info-card">
                    <div class="card-icon">
                        <img src="이미지/돈.png" alt="적립금">
                    </div>
                    <div class="card-label">총 적립금</div>
                    <div class="card-value"><span id="customer-points-card">0</span> <span>P</span></div>
                </div>
                <div class="info-card">
                    <div class="card-icon">
                        <img src="이미지/쿠폰.png" alt="쿠폰">
                    </div>
                    <div class="card-label">사용 가능 쿠폰</div>
                    <div class="card-value"><span id="customer-coupons-count">0</span> <span>장</span></div>
                </div>
            </div>

            <!-- 최근 내역 -->
            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">최근 이용 내역</h2>
                </div>
                <div class="history-list" id="customer-history">
                    <!-- 동적으로 생성 -->
                </div>
            </div>
        </div>

        <!-- ===== 관리자 대시보드 ===== -->
        <div id="admin" class="screen admin-dashboard">
            <header class="app-header">
                <button class="header-back">←</button>
                <h1 class="header-title">관리자</h1>
                <div class="header-action"></div>
            </header>

            <!-- 통계 그리드 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total-customers">0</div>
                    <div class="stat-label">총 고객</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-birthday-month">0</div>
                    <div class="stat-label">이달 생일</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-return-rate">0%</div>
                    <div class="stat-label">재방문율</div>
                </div>
            </div>

            <!-- 검색 -->
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input
                        type="text"
                        id="admin-search"
                        placeholder="이름 또는 전화번호로 검색"
                    >
                </div>
            </div>

            <!-- iOS Segmented Control -->
            <div class="tabs">
                <div class="tabs-inner">
                    <button class="tab-btn active" data-tab="customers">고객 DB</button>
                    <button class="tab-btn" data-tab="birthday">생일관리</button>
                    <button class="tab-btn" data-tab="analysis">분석</button>
                </div>
            </div>

            <!-- 탭 콘텐츠: 고객 DB -->
            <div id="tab-customers" class="tab-content active">
                <div class="customer-list" id="customer-list">
                    <!-- 동적으로 생성 -->
                </div>
            </div>

            <!-- 탭 콘텐츠: 생일관리 -->
            <div id="tab-birthday" class="tab-content">
                <div class="birthday-header">
                    <img src="이미지/Gemini_Generated_Image_8nzjal8nzjal8nzj-removebg-preview-Photoroom.png" alt="생일 캐릭터" class="birthday-character">
                </div>
                <div class="section">
                    <div class="section-header">
                        <h2 class="section-title">다가오는 생일</h2>
                    </div>
                </div>
                <div class="birthday-list" id="birthday-list">
                    <!-- 동적으로 생성 -->
                </div>
            </div>

            <!-- 탭 콘텐츠: 분석 -->
            <div id="tab-analysis" class="tab-content">
                <div class="analysis-cards" id="analysis-content">
                    <!-- 동적으로 생성 -->
                </div>
            </div>
        </div>

        <!-- ===== 고객 상세 화면 ===== -->
        <div id="customer-detail" class="screen">
            <header class="app-header" style="background: transparent; position: absolute; border: none;">
                <button class="header-back" style="background: rgba(255,255,255,0.2); color: white;">←</button>
                <h1 class="header-title" style="color: white;"></h1>
                <div class="header-action"></div>
            </header>

            <div class="customer-detail-header">
                <div class="customer-detail-avatar" id="detail-avatar">김</div>
                <div class="customer-detail-name" id="detail-name">김민지</div>
                <div class="customer-detail-phone" id="detail-phone">010-1234-5678</div>
            </div>

            <div class="customer-detail-stats">
                <div class="detail-stat">
                    <div class="detail-stat-value" id="detail-points">0</div>
                    <div class="detail-stat-label">적립금</div>
                </div>
                <div class="detail-stat">
                    <div class="detail-stat-value" id="detail-visits">0</div>
                    <div class="detail-stat-label">방문</div>
                </div>
                <div class="detail-stat">
                    <div class="detail-stat-value" id="detail-coupons">0</div>
                    <div class="detail-stat-label">쿠폰</div>
                </div>
            </div>

            <div class="customer-memo">
                <div class="memo-label">고객 메모</div>
                <div class="memo-content" id="detail-memo">메모가 없습니다.</div>
            </div>

            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">방문 기록</h2>
                </div>
                <div class="history-list" id="detail-history">
                    <!-- 동적으로 생성 -->
                </div>
            </div>
        </div>

    </div>

    <!-- 스크립트 -->
    <script src="data/database.js"></script>
    <script src="app.js"></script>
</body>
</html>
